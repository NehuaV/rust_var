[package]
name = "rust_var"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
gpui = "0.2.2"
nalgebra = "0.35.0"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
statrs = "0.18.0"

[[bin]]
name = "rust_var"
path = "src/main.rs"

[lints.clippy]
implicit_return = "allow"
